<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AVOX CODE Trading Video</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#000;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
}

.video-container{
    position:relative;
    width:100%;
    max-width:900px;
    height:min(75vh,650px);
    background:#111;
    overflow:hidden;
}

#photo{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
}

.overlay{
    position:absolute;
    inset:0;
    pointer-events:none;
}

/* Slight camera movement */
.camera-effect{
    animation:cameraMove 18s ease-in-out infinite alternate;
}

@keyframes cameraMove{
    from{
        transform:scale(1);
    }
    to{
        transform:scale(1.035);
    }
}

/* Speaking indicator */
.speaking{
    position:absolute;
    left:50%;
    bottom:110px;
    transform:translateX(-50%);
    display:none;
    align-items:center;
    gap:6px;
}

.speaking span{
    width:6px;
    height:6px;
    background:#fff;
    border-radius:50%;
    animation:speak .55s infinite alternate;
}

.speaking span:nth-child(2){
    animation-delay:.15s;
}

.speaking span:nth-child(3){
    animation-delay:.3s;
}

@keyframes speak{
    from{
        transform:scaleY(.5);
    }
    to{
        transform:scaleY(2);
    }
}

/* Captions */
.caption{
    position:absolute;
    left:5%;
    right:5%;
    bottom:25px;
    text-align:center;
    font-size:clamp(18px,3vw,32px);
    font-weight:bold;
    line-height:1.3;
    text-shadow:
        2px 2px 4px #000,
        -2px -2px 4px #000,
        0 0 8px #000;
}

/* Gesture overlay */
.gesture{
    position:absolute;
    left:50%;
    bottom:28%;
    transform:translateX(-50%);
    font-size:55px;
    opacity:0;
}

.gesture.show{
    animation:gestureMove 1.3s ease-in-out;
}

@keyframes gestureMove{
    0%{
        opacity:0;
        transform:translateX(-50%) scale(.8);
    }
    30%{
        opacity:.9;
        transform:translateX(-50%) scale(1.05);
    }
    70%{
        opacity:.8;
        transform:translateX(-50%) scale(1);
    }
    100%{
        opacity:0;
        transform:translateX(-50%) scale(.9);
    }
}

.controls{
    width:100%;
    max-width:900px;
    background:#111;
    padding:18px;
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:center;
}

button{
    border:none;
    border-radius:8px;
    padding:12px 20px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

#startBtn{
    background:#2563eb;
    color:#fff;
}

#pauseBtn{
    background:#f59e0b;
    color:#000;
}

#resetBtn{
    background:#dc2626;
    color:#fff;
}

button:disabled{
    opacity:.5;
}

.info{
    max-width:900px;
    width:100%;
    padding:18px;
    background:#171717;
    color:#ddd;
    line-height:1.6;
}

.info h2{
    color:#fff;
    margin-bottom:8px;
}

input[type="file"]{
    width:100%;
    margin-top:10px;
    padding:10px;
    background:#222;
    color:#fff;
    border-radius:6px;
}

.progress{
    width:100%;
    max-width:900px;
    height:5px;
    background:#333;
}

.progress-bar{
    height:100%;
    width:0%;
    background:#2563eb;
}
</style>
</head>

<body>

<div class="video-container">

    <div class="camera-effect" id="camera">

        <!-- YOUR PHOTO -->
        <img
            id="photo"
            src="1000167250.jpg"
            alt="Presenter"
        >

    </div>

    <div class="overlay">

        <!-- Speaking animation -->
        <div class="speaking" id="speaking">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <!-- Gesture indicators -->
        <div class="gesture" id="gesture">👐</div>

        <!-- Captions -->
        <div class="caption" id="caption">
            Hello everyone.
        </div>

    </div>

</div>

<div class="progress">
    <div class="progress-bar" id="progressBar"></div>
</div>

<div class="controls">

    <button id="startBtn">
        ▶ Start Video
    </button>

    <button id="pauseBtn">
        ⏸ Pause
    </button>

    <button id="resetBtn">
        ↻ Reset
    </button>

</div>

<div class="info">

    <h2>AVOX CODE Trading Presentation</h2>

    <p>
        Upload your recorded voice below. The page will play your
        recording while displaying the English captions.
    </p>

    <input
        type="file"
        id="audioFile"
        accept="audio/*,video/*"
    >

</div>

<audio id="voice"></audio>

<script>

/* =====================================================
   AVOX CODE VIDEO PRESENTATION
   ===================================================== */

const scriptLines = [

    {
        text:"Hello everyone.",
        start:0,
        end:3
    },

    {
        text:"Today I'm going to show you how to use AVOX CODE for trading.",
        start:3,
        end:8
    },

    {
        text:"First, open your platform and choose the market you want to trade.",
        start:8,
        end:14
    },

    {
        text:"Check the price movement carefully, then use proper risk management before placing a trade.",
        start:14,
        end:22
    },

    {
        text:"Remember, no trade is guaranteed to win.",
        start:22,
        end:27
    },

    {
        text:"The goal is to make informed decisions, follow a plan, and manage your risk.",
        start:27,
        end:35
    }

];

const photo =
document.getElementById("photo");

const voice =
document.getElementById("voice");

const caption =
document.getElementById("caption");

const speaking =
document.getElementById("speaking");

const gesture =
document.getElementById("gesture");

const startBtn =
document.getElementById("startBtn");

const pauseBtn =
document.getElementById("pauseBtn");

const resetBtn =
document.getElementById("resetBtn");

const audioFile =
document.getElementById("audioFile");

const progressBar =
document.getElementById("progressBar");

let playing = false;
let gestureTimer = null;


/* =====================================================
   LOAD YOUR VOICE RECORDING
   ===================================================== */

audioFile.addEventListener("change", function(){

    const file = this.files[0];

    if(!file){
        return;
    }

    const url =
    URL.createObjectURL(file);

    voice.src = url;

    alert(
        "Your voice recording has been loaded successfully."
    );

});


/* =====================================================
   START
   ===================================================== */

startBtn.addEventListener("click", async function(){

    if(!voice.src){

        alert(
            "Please upload your voice recording first."
        );

        return;
    }

    try{

        await voice.play();

        playing = true;

        speaking.style.display =
        "flex";

        startGestures();

    }catch(error){

        console.log(error);

        alert(
            "Please tap Start again to allow audio playback."
        );

    }

});


/* =====================================================
   PAUSE
   ===================================================== */

pauseBtn.addEventListener("click", function(){

    if(voice.paused){

        voice.play();

        playing = true;

        speaking.style.display =
        "flex";

    }else{

        voice.pause();

        playing = false;

        speaking.style.display =
        "none";

    }

});


/* =====================================================
   RESET
   ===================================================== */

resetBtn.addEventListener("click", function(){

    voice.pause();

    voice.currentTime = 0;

    caption.textContent =
    "Hello everyone.";

    progressBar.style.width =
    "0%";

    playing = false;

    speaking.style.display =
    "none";

    gesture.classList.remove("show");

});


/* =====================================================
   CAPTIONS
   ===================================================== */

voice.addEventListener("timeupdate", function(){

    const current =
    voice.currentTime;

    const duration =
    voice.duration || 35;

    const percentage =
    (current / duration) * 100;

    progressBar.style.width =
    percentage + "%";

    let currentLine =
    scriptLines[0];

    for(
        let i=0;
        i<scriptLines.length;
        i++
    ){

        if(
            current >= scriptLines[i].start &&
            current < scriptLines[i].end
        ){

            currentLine =
            scriptLines[i];

            break;
        }

    }

    caption.textContent =
    currentLine.text;

});


/* =====================================================
   NATURAL PRESENTATION GESTURES
   ===================================================== */

function startGestures(){

    if(gestureTimer){
        clearInterval(gestureTimer);
    }

    gestureTimer =
    setInterval(function(){

        if(!playing){
            return;
        }

        gesture.classList.remove("show");

        void gesture.offsetWidth;

        gesture.classList.add("show");

    },3500);

}


/* =====================================================
   WHEN AUDIO FINISHES
   ===================================================== */

voice.addEventListener("ended", function(){

    playing = false;

    speaking.style.display =
    "none";

    gesture.classList.remove("show");

    caption.textContent =
    "Thank you for watching.";

});


/* =====================================================
   KEYBOARD CONTROLS
   ===================================================== */

document.addEventListener(
    "keydown",
    function(event){

        if(event.code === "Space"){

            event.preventDefault();

            pauseBtn.click();

        }

        if(event.key === "r"){

            resetBtn.click();

        }

    }
);

</script>

</body>
</html>
